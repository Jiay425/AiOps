name: ops-autoagent-full

services:
  mysql:
    image: mysql:8.0.32
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env.full.local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ops_autoagent}
    ports: ["13306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in deploy/.env.full.local}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://kafka:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["9092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  redis:
    image: redis:6.2
    ports: ["16379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ../docs/dev-ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../docs/dev-ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports: ["9093:9093"]
    volumes: ["../docs/dev-ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]

  elasticsearch:
    image: elasticsearch:7.17.28
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
    ports: ["9200:9200"]
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
      # OTel traces are disabled by default in this OAP line.  Enable the
      # actual TraceService receiver used by FastAPI instrumentation.  OAP
      # converts OTLP traces through its Zipkin receiver, so this companion
      # receiver must be enabled as well (otherwise exports fail with
      # `receiver-zipkin missing`).
      SW_OTEL_RECEIVER_ENABLED_HANDLERS: otlp-traces,otlp-metrics,otlp-logs
      SW_RECEIVER_ZIPKIN: default
    ports: ["11800:11800", "12800:12800"]
    depends_on:
      elasticsearch: {condition: service_healthy}

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    environment: {SW_OAP_ADDRESS: http://skywalking-oap:12800}
    ports: ["18080:8080"]
    depends_on: [skywalking-oap]

  grafana:
    image: grafana/grafana:10.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env.full.local}
    ports: ["4000:3000"]
    volumes: ["../docs/dev-ops/grafana/provisioning:/etc/grafana/provisioning:ro"]
    depends_on: [prometheus]

  app:
    build: ..
    environment:
      OPS_RUNTIME_MODE: production
      MYSQL_URL: mysql://mysql:3306/${MYSQL_DATABASE:-ops_autoagent}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      PROMETHEUS_BASE_URL: http://prometheus:9090
      ELK_BASE_URL: http://elasticsearch:9200
      SKYWALKING_GRAPHQL_URL: http://skywalking-oap:12800/graphql
      OPS_OTEL_ENABLED: "true"
      OPS_OTEL_SERVICE_NAME: ops-autoagent
      OPS_OTEL_EXPORTER_OTLP_ENDPOINT: skywalking-oap:11800
      # These remain empty by default. Supply them only in the invoking shell
      # for a real OpenAI-compatible provider; never add credentials to this file.
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.deepseek.com}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-deepseek-flash}"
      CODEOPS_LLM_FLASH_MODEL: "${CODEOPS_LLM_FLASH_MODEL:-deepseek-flash}"
      CODEOPS_TEST_EXECUTION_ENABLED: "true"
      CODEOPS_APPLY_MODE: apply_to_worktree
      CODEOPS_AUTO_APPLY_ENABLED: "true"
      CODEOPS_AUTO_APPLY_MIN_CONFIDENCE: HIGH
      CODEOPS_TEST_EXECUTION_TIMEOUT_MS: "300000"
    ports: ["8099:8099"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/actuator/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      mysql: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  mysql-data:
  neo4j-data:
  redis-data:
  prometheus-data:
  elasticsearch-data:
