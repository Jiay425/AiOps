[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ops-autoagent-diagnosis"
version = "2.0.0"
description = "LangGraph-based operations diagnosis and CodeOps agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "langgraph==1.2.9",
  "langgraph-checkpoint-sqlite==3.1.0",
  "langgraph-checkpoint-postgres==3.1.2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "httpx==0.28.1",
  "aiosqlite==0.21.0",
  "python-multipart==0.0.20",
  "prometheus-client==0.22.1",
  "asyncpg>=0.30,<1",
  "aiomysql>=0.2,<1",
  "cryptography>=43,<46",
  "neo4j>=5.28,<7",
  "confluent-kafka>=2.8,<3",
  "numpy>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "redis>=5,<7",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "ruff==0.12.7"]

[project.scripts]
ops-autoagent = "ops_autoagent.main:run"
ops-autoagent-demo = "ops_autoagent.demo:main"
ops-autoagent-topology-sync = "ops_autoagent.topology_sync:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_autoagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
